name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*\\.[0-9]*\\.[0-9]*"]
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt SDK release version (e.g. 25.12.0)
        required: false
        default: "25.12.0"
      package_format:
        description: Package format to build (auto, apk or ipk)
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - apk
          - ipk

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.0' }}
  PACKAGE_NAME: luci-theme-signal-loop
  PACKAGE_FORMAT: ${{ inputs.package_format || 'auto' }}
  SDK_TARGET: x86/64

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is not a stable semantic version (expected vX.Y.Z)"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=$version" >> "$GITHUB_OUTPUT"
          else
            # APK uses '-' as the package/revision separator, so a version
            # such as 0.0.0-beta-<sha> is rejected by apk mkpkg. Use an
            # APK-compatible prerelease and put the short SHA in the artifact
            # name instead.
            version="0.0.0_beta${GITHUB_RUN_NUMBER}"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=${short_sha}" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ gcc-multilib g++-multilib \
            gawk gettext bison flex \
            libncurses-dev zlib1g-dev libssl-dev \
            python3 unzip file rsync wget git zstd

      - name: Resolve and download OpenWrt SDK
        id: sdk
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${SDK_TARGET}"
          SDK_FILE="$(curl -fsSL "$BASE/sha256sums" \
            | awk '{print $2}' | sed 's/^\*//' \
            | grep -E '^openwrt-sdk-.*x86-64.*Linux-x86_64\.tar\.zst$' \
            | head -n1)"
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Could not resolve an SDK filename for OpenWrt ${OPENWRT_VERSION} at ${BASE}"
            exit 1
          fi
          echo "Using SDK: $SDK_FILE"
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.zst" "$BASE/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -I zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          echo "dir=$RUNNER_TEMP/sdk" >> "$GITHUB_OUTPUT"

      - name: Add package to SDK
        run: |
          set -euo pipefail
          mkdir -p "$SDK_DIR/package/${PACKAGE_NAME}"
          git archive --format=tar HEAD "themes/${PACKAGE_NAME}" \
            | tar -x -C "$SDK_DIR/package/${PACKAGE_NAME}" --strip-components=2
          ls -la "$SDK_DIR/package/${PACKAGE_NAME}"

      - name: Configure package
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: |
          set -euo pipefail
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          # Decide the package format: OpenWrt >= 25.x builds APK by default,
          # older releases build IPK. PACKAGE_FORMAT can force either one.
          use_ipk=0
          case "${PACKAGE_FORMAT}" in
            ipk) use_ipk=1 ;;
            apk) use_ipk=0 ;;
            *)
              major="${OPENWRT_VERSION%%.*}"
              [ "${major:-0}" -ge 25 ] || use_ipk=1
              ;;
          esac
          echo "Building format: $([ "$use_ipk" = 1 ] && echo ipk || echo apk)"
          if [ "$use_ipk" = 1 ]; then
            echo 'CONFIG_USE_APK=n' >> .config
          else
            # Avoid requiring a signing key for the individual .apk files.
            echo 'CONFIG_SIGN_EACH_PACKAGE=n' >> .config
          fi
          # Select the theme so that package/<name>/compile produces the package file.
          echo 'CONFIG_PACKAGE_luci-theme-signal-loop=m' >> .config
          make defconfig

      - name: Compile package
        working-directory: ${{ steps.sdk.outputs.dir }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make "package/${PACKAGE_NAME}/compile" V=s -j"$(nproc)" \
            "SIGNAL_LOOP_VERSION=${VERSION}"

      - name: Collect artifacts
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin -type f \
            \( -name "${PACKAGE_NAME}*.ipk" -o -name "${PACKAGE_NAME}*.apk" \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          cd "$GITHUB_WORKSPACE/dist"
          shopt -s nullglob
          files=(./*.ipk ./*.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No package produced by the build"
            echo "--- bin/packages tree ---"
            find "$SDK_DIR/bin" -maxdepth 5 -type d 2>/dev/null | head -60
            exit 1
          fi
          sha256sum "${files[@]}" > sha256sums.txt
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.artifact_suffix }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
