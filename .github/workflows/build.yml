name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt SDK release version (e.g. 25.12.0)
        required: false
        default: "25.12.0"
      package_format:
        description: Package format to build (auto, apk or ipk)
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - apk
          - ipk

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.0' }}
  PACKAGE_NAME: luci-theme-signal-loop
  PACKAGE_FORMAT: ${{ inputs.package_format || 'auto' }}
  SDK_TARGET: x86/64

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ gcc-multilib g++-multilib \
            gawk gettext bison flex \
            libncurses-dev zlib1g-dev libssl-dev \
            python3 unzip file rsync wget git zstd

      - name: Resolve and download OpenWrt SDK
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${SDK_TARGET}"
          SDK_FILE="$(curl -fsSL "$BASE/sha256sums" \
            | awk '{print $2}' | sed 's/^\*//' \
            | grep -E '^openwrt-sdk-.*x86-64.*Linux-x86_64\.tar\.zst$' \
            | head -n1)"
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Could not resolve an SDK filename for OpenWrt ${OPENWRT_VERSION} at ${BASE}"
            exit 1
          fi
          echo "Using SDK: $SDK_FILE"
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.zst" "$BASE/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -I zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Add package to SDK
        run: |
          set -euo pipefail
          mkdir -p "$SDK_DIR/package/${PACKAGE_NAME}"
          git archive --format=tar HEAD "themes/${PACKAGE_NAME}" \
            | tar -x -C "$SDK_DIR/package/${PACKAGE_NAME}" --strip-components=2
          ls -la "$SDK_DIR/package/${PACKAGE_NAME}"

      - name: Configure package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          # Decide the package format: OpenWrt >= 25.x builds APK by default,
          # older releases build IPK. PACKAGE_FORMAT can force either one.
          use_ipk=0
          case "${PACKAGE_FORMAT}" in
            ipk) use_ipk=1 ;;
            apk) use_ipk=0 ;;
            *)
              major="${OPENWRT_VERSION%%.*}"
              [ "${major:-0}" -ge 25 ] || use_ipk=1
              ;;
          esac
          echo "Building format: $([ "$use_ipk" = 1 ] && echo ipk || echo apk)"
          if [ "$use_ipk" = 1 ]; then
            echo 'CONFIG_USE_APK=n' >> .config
          else
            # Avoid requiring a signing key for the individual .apk files.
            echo 'CONFIG_SIGN_EACH_PACKAGE=n' >> .config
          fi
          # Select the theme so that package/<name>/compile produces the package file.
          echo 'CONFIG_PACKAGE_luci-theme-signal-loop=m' >> .config
          make defconfig

      - name: Compile package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          args=(-j"$(nproc)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            args+=("PKG_VERSION=${GITHUB_REF_NAME#v}")
          fi
          make "package/${PACKAGE_NAME}/compile" V=s "${args[@]}"

      - name: Collect artifacts
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin -type f \
            \( -name "${PACKAGE_NAME}*.ipk" -o -name "${PACKAGE_NAME}*.apk" \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          cd "$GITHUB_WORKSPACE/dist"
          shopt -s nullglob
          files=(./*.ipk ./*.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No package produced by the build"
            echo "--- bin/packages tree ---"
            find "$SDK_DIR/bin" -maxdepth 5 -type d 2>/dev/null | head -60
            exit 1
          fi
          sha256sum "${files[@]}" > sha256sums.txt
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
