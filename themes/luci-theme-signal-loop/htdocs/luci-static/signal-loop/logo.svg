<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="44" viewBox="0 0 224 44">
  <title>signal-loop</title>
  <!-- icon: signal bars inside an open loop -->
  <g transform="translate(1 1) scale(0.64)">
    <circle cx="32" cy="32" r="22" fill="none" stroke="#4bb3ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="104 34" transform="rotate(-52 32 32)"/>
    <rect x="22" y="34" width="4.5" height="8" rx="1.5" fill="#e76e01"/>
    <rect x="29.75" y="28" width="4.5" height="14" rx="1.5" fill="#f87b0b"/>
    <rect x="37.5" y="21" width="4.5" height="21" rx="1.5" fill="#ffa53c"/>
  </g>
  <!-- wordmark: white "signal" + DD-WRT blue "loop" -->
  <text x="50" y="31" font-family="Verdana, Geneva, Arial, sans-serif" font-size="24" font-weight="bold" letter-spacing="-0.8"><tspan fill="#ffffff">signal</tspan><tspan fill="#4bb3ff">-loop</tspan></text>
</svg>
